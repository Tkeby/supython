name: dev-app

services:
  db:
    build: ./docker/postgres
    container_name: dev-app-db
    environment:
      POSTGRES_USER: dev-app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-app}
      POSTGRES_DB: dev-app
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - dev-app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev-app -d dev-app"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: dev-app-postgrest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:-authenticator}@db:5432/dev-app
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "@/etc/postgrest/jwks.json"
      PGRST_JWT_AUD: authenticated
      PGRST_OPENAPI_MODE: ignore-privileges
      PGRST_DB_USE_LEGACY_GUCS: "false"
    volumes:
      - ./.supython/jwks.json:/etc/postgrest/jwks.json:ro

  supython:
    # Pin to a release tag, or replace with `build: .` if you are building from source.
    image: ghcr.io/<owner>/supython:<version>
    container_name: dev-app-api
    depends_on:
      postgrest:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./.supython/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ./.supython/jwks.json:/run/secrets/jwks.json:ro
      - dev-app-storage:/var/lib/supython/storage
    ports:
      - "${SUPYTHON_PUBLISH_PORT:-8000}:8000"

  worker:
    image: ghcr.io/<owner>/supython:<version>
    profiles: ["worker"]
    container_name: dev-app-worker
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./.supython/jwt_private.pem:/run/secrets/jwt_private.pem:ro
    command: ["supython", "worker", "run", "--queue", "default"]

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    container_name: dev-app-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dev-app-caddy-data:/data
      - dev-app-caddy-config:/config
    depends_on:
      - supython

volumes:
  dev-app-db-data:
  dev-app-storage:
  dev-app-caddy-data:
  dev-app-caddy-config:

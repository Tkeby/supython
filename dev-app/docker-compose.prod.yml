name: supython

services:
  db:
    build: ../docker/postgres
    container_name: supython-db
    environment:
      POSTGRES_USER: supython
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supython}
      POSTGRES_DB: supython
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - supython-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supython -d supython"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: supython-postgrest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:-authenticator}@db:5432/supython
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "@/etc/postgrest/jwks.json"
      PGRST_JWT_AUD: authenticated
      PGRST_OPENAPI_MODE: ignore-privileges
      PGRST_DB_USE_LEGACY_GUCS: "false"
    volumes:
      - ./.supython/jwks.json:/etc/postgrest/jwks.json:ro

  supython:
    build: ..
    container_name: supython-api
    depends_on:
      postgrest:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./.supython/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ./.supython/jwks.json:/run/secrets/jwks.json:ro
      - supython-storage:/var/lib/supython/storage
    ports:
      - "${SUPYTHON_PUBLISH_PORT:-8000}:8000"

  worker:
    build: ..
    profiles: ["worker"]
    container_name: supython-worker
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./.supython/jwt_private.pem:/run/secrets/jwt_private.pem:ro
    command: ["supython", "worker", "run", "--queue", "default"]

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    container_name: supython-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - supython

volumes:
  supython-db-data:
  supython-storage:
  caddy-data:
  caddy-config:

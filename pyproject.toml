[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "supython"
version = "0.1.16"
description = "A lightweight Postgres-first BaaS framework for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tkeby", email = "tsegaw.dev@gmail.com" }]
keywords = ["postgres", "postgrest", "baas", "fastapi", "auth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    "typer>=0.15",
    "httpx>=0.28",
    "authlib>=1.3",
    "aiosmtplib>=3.0",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
s3 = [
    "aioboto3>=13.0",
]
arq = [
    "arq>=0.26",
]
dramatiq = [
    "dramatiq>=1.17",
]
cron-inproc = [
    "croniter>=2.0",
]
client = [
    "postgrest>=0.16.0",
    "realtime>=2.0.0",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/Tkeby/supython"
Repository = "https://github.com/Tkeby/supython"
Issues = "https://github.com/Tkeby/supython/issues"
Changelog = "https://github.com/Tkeby/supython/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Tkeby/supython/blob/main/docs/PROJECT.md"

[project.scripts]
supython = "supython.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/supython"]
exclude = [
    "src/supython/admin/static/assets/*.map",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/supython",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Default to the full tree; subsets are addressable via path:
#   pytest tests/unit               # fast, no Docker needed
#   pytest tests/integration        # requires `supython test up`
#   supython test run               # bootstraps the test DB and runs everything
testpaths = ["tests"]
markers = [
    "pg_cron: requires pg_cron extension available",
    "slow: tests that take more than a few seconds",
]
filterwarnings = [
    "ignore:authlib.jose module is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
